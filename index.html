<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Split-flap clock</title>
  <style>
    :root {
      --card: #e7e7e5;
      --ink: #111111;
      --edge: rgba(0, 0, 0, .08);
      --shadow: rgba(0, 0, 0, .17);
      --seam: rgba(0, 0, 0, .18);
      --toggle-track: #e4e4e2;
      --toggle-knob: #111111;
      --toggle-icon: #37352f;
    }
    [data-mode="night"] {
      --card: #373737;
      --ink: #e9e9e7;
      --edge: rgba(255, 255, 255, .10);
      --shadow: rgba(0, 0, 0, .42);
      --seam: rgba(0, 0, 0, .42);
      --toggle-track: #4a4a4a;
      --toggle-knob: #e7e7e5;
      --toggle-icon: #e7e7e5;
    }
    * { box-sizing: border-box; }
    html, body, #clockRoot {
      margin: 0; width: 100%; height: 100%; min-height: 100%;
      background: transparent !important; background-image: none !important; overflow: hidden;
    }
    .clock, .digit-group, .controls { background: transparent !important; background-image: none !important; }
    body {
      display: grid;
      place-items: center;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .clock-wrap { --scale: 1; display: grid; justify-items: center; align-content: center; gap: calc(18px * var(--scale)); width: 100%; height: 100%; }
    .clock { display: flex; align-items: center; gap: calc(13px * var(--scale)); }
    .digit-group { display: flex; gap: calc(10px * var(--scale)); }
    .digit {
      position: relative;
      width: calc(90px * var(--scale));
      height: calc(116px * var(--scale));
      border-radius: calc(11px * var(--scale));
      background: var(--card);
      color: var(--ink);
      box-shadow: 0 calc(11px * var(--scale)) calc(18px * var(--scale)) var(--shadow), 0 calc(2px * var(--scale)) calc(3px * var(--scale)) rgba(0,0,0,.08), inset 0 calc(1px * var(--scale)) 0 rgba(255,255,255,.52), inset 0 calc(-1px * var(--scale)) 0 var(--edge);
      border: 1px solid var(--edge);
      overflow: hidden;
      perspective: 500px;
      transform-style: preserve-3d;
      transition: background-color .35s ease, color .35s ease, box-shadow .35s ease;
    }
    .digit::after {
      content: "";
      position: absolute;
      left: 0; right: 0; top: 50%; height: 1px;
      z-index: 5;
      background: var(--seam);
      box-shadow: 0 1px 0 rgba(255,255,255,.18), 0 2px 3px rgba(0,0,0,.08);
    }
    .half {
      position: absolute;
      left: 0; width: 100%; height: 50%; overflow: hidden;
      display: block;
      font-size: calc(80px * var(--scale));
      font-weight: 800;
      letter-spacing: -.07em;
      line-height: 1.48;
      font-variant-numeric: tabular-nums;
      backface-visibility: hidden;
    }
    .half span {
      position: absolute; left: 0; width: 100%; height: 200%;
      display: block; text-align: center; line-height: 1.45;
    }
    .top { top: 0; }
    .top span { top: 0; }
    .bottom { bottom: 0; }
    .bottom span { top: -100%; }
    .flip-top, .flip-bottom {
      position: absolute; inset-inline: 0; height: 50%; z-index: 4;
      display: block; overflow: hidden;
      color: var(--ink); background: var(--card);
      font-size: calc(80px * var(--scale)); font-weight: 800;
      letter-spacing: -.07em; line-height: 1.48; font-variant-numeric: tabular-nums;
      backface-visibility: hidden;
    }
    .flip-top { top: 0; transform-origin: bottom; }
    .flip-bottom { bottom: 0; transform-origin: top; transform: rotateX(90deg); }
    .flip-top span, .flip-bottom span {
      position: absolute; left: 0; width: 100%; height: 200%;
      display: block; text-align: center; line-height: 1.45;
    }
    .flip-top span { top: 0; }
    .flip-bottom span { top: -100%; }
    .digit.flipping .flip-top { animation: fold .28s ease-in forwards; }
    .digit.flipping .flip-bottom { animation: unfold .28s .28s ease-out forwards; }
    @keyframes fold { to { transform: rotateX(-90deg); } }
    @keyframes unfold { to { transform: rotateX(0deg); } }
    .colon { color: var(--ink); font-size: calc(58px * var(--scale)); font-weight: 800; line-height: 1; padding-bottom: calc(4px * var(--scale)); transition: color .35s ease; }
    .controls { display: flex; justify-content: center; }
    .mode-toggle {
      border: 0; padding: 0; background: transparent; color: var(--toggle-icon);
      display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .mode-toggle:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; border-radius: 999px; }
    .mode-icon { font: calc(16px * var(--scale))/1 system-ui, sans-serif; }
    .toggle-track {
      position: relative; display: block; width: calc(54px * var(--scale)); height: calc(27px * var(--scale)); padding: calc(3px * var(--scale));
      border: 1px solid rgba(0,0,0,.10); border-radius: 999px; background: var(--toggle-track);
      box-shadow: inset 0 1px 2px rgba(0,0,0,.08);
      transition: background-color .3s ease, border-color .3s ease;
    }
    .toggle-knob {
      display: block; width: calc(19px * var(--scale)); height: calc(19px * var(--scale)); border-radius: 50%; background: var(--toggle-knob);
      box-shadow: 0 1px 2px rgba(0,0,0,.18); transform: translateX(0);
      transition: transform .28s cubic-bezier(.2,.8,.2,1), background-color .3s ease;
    }
    [data-mode="night"] .toggle-knob { transform: translateX(calc(27px * var(--scale))); }
    .mode-toggle .sun { color: var(--toggle-icon); }
    .mode-toggle .moon { color: #e6a85e; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="clock-wrap" id="clockRoot" data-mode="day" aria-label="Split-flap clock">
    <div class="clock" role="timer" aria-live="off" aria-label="Current time">
      <div class="digit-group" aria-hidden="true">
        <div class="digit" data-digit="0"></div><div class="digit" data-digit="1"></div>
      </div>
      <span class="colon" aria-hidden="true">:</span>
      <div class="digit-group" aria-hidden="true">
        <div class="digit" data-digit="2"></div><div class="digit" data-digit="3"></div>
      </div>
    </div>
    <div class="controls">
      <button class="mode-toggle" id="modeToggle" type="button" aria-pressed="false" aria-label="Switch to night mode">
        <span class="mode-icon sun" aria-hidden="true">☼</span>
        <span class="toggle-track" aria-hidden="true"><span class="toggle-knob"></span></span>
        <span class="mode-icon moon" aria-hidden="true">☾</span>
      </button>
    </div>
  </main>
  <script>
    (() => {
      const root = document.getElementById('clockRoot');
      const digits = [...document.querySelectorAll('.digit')];
      const toggle = document.getElementById('modeToggle');
      const pad = n => String(n).padStart(2, '0');

      // Scale the entire clock to the available iframe/widget box (about 450×161 at 1×).
      const resizeObserver = new ResizeObserver(([entry]) => {
        const { width, height } = entry.contentRect;
        if (!width || !height) return;
        const scale = Math.max(.25, Math.min(2.5, width / 450, height / 161));
        root.style.setProperty('--scale', scale.toFixed(3));
      });
      resizeObserver.observe(root);

      function renderDigit(el, value, animate = false) {
        const old = el.dataset.value;
        if (old === value) return;
        if (animate && old !== undefined) {
          // Keep the old face underneath both moving flaps until the lower flap lands.
          el.innerHTML = `<div class="half top"><span>${old}</span></div><div class="half bottom"><span>${old}</span></div>`;
          const top = document.createElement('div');
          top.className = 'flip-top'; top.innerHTML = `<span>${old}</span>`;
          const bottom = document.createElement('div');
          bottom.className = 'flip-bottom'; bottom.innerHTML = `<span>${value}</span>`;
          el.append(top, bottom); el.classList.remove('flipping');
          void el.offsetWidth; el.classList.add('flipping');
          bottom.addEventListener('animationend', () => {
            el.innerHTML = `<div class="half top"><span>${value}</span></div><div class="half bottom"><span>${value}</span></div>`;
            el.classList.remove('flipping');
          }, { once: true });
        } else {
          el.innerHTML = `<div class="half top"><span>${value}</span></div><div class="half bottom"><span>${value}</span></div>`;
        }
        el.dataset.value = value;
      }
      function update() {
        const now = new Date();
        const time = pad(now.getHours()) + pad(now.getMinutes());
        digits.forEach((el, i) => renderDigit(el, time[i], true));
        document.querySelector('.clock').setAttribute('aria-label', `Current time ${time.slice(0,2)}:${time.slice(2)}`);
      }
      toggle.addEventListener('click', () => {
        const night = root.dataset.mode !== 'night';
        root.dataset.mode = night ? 'night' : 'day';
        toggle.setAttribute('aria-pressed', String(night));
        toggle.setAttribute('aria-label', `Switch to ${night ? 'day' : 'night'} mode`);
      });
      update();
      window.setInterval(update, 1000);
    })();
  </script>
</body>
</html>
